name: Refresh and publish AI Foundry

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ai-foundry-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record current published snapshot
        run: git show HEAD:data/published.json > "$RUNNER_TEMP/published-before.json"

      - name: Refresh validated snapshot
        run: npm run ingest

      - name: Validate publication
        run: npm run lint && npm run build && npm test

      - name: Detect published data changes
        id: publication
        run: |
          changed="$(node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const before = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/published-before.json`, 'utf8'));
          const after = JSON.parse(await readFile('data/published.json', 'utf8'));
          process.stdout.write(before.snapshotId === after.snapshotId ? 'false' : 'true');
          NODE
          )"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit generated artifacts
        if: github.ref == 'refs/heads/main' && steps.publication.outputs.changed == 'true'
        run: |
          git config user.name 'ai-foundry-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/published.json data/previous.json data/run-status.json data/source-status.json
          if git diff --cached --quiet; then
            echo 'No generated artifact changes to commit.'
          else
            git commit -m 'chore: refresh published AI feed'
            git push origin HEAD:main
          fi
