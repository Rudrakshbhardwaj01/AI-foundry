name: Refresh and publish AI Foundry

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ai-foundry-publication
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh validated snapshot
        run: npm run ingest

      - name: Validate publication
        run: npm run lint && npm run build && npm test

      - name: Commit generated artifacts
        run: |
          git config user.name 'ai-foundry-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/published.json data/previous.json data/run-status.json data/source-status.json
          if git diff --cached --quiet; then
            echo 'No generated artifact changes to commit.'
          else
            git commit -m 'chore: refresh published AI feed'
            git push
          fi

      - name: Build static Pages artifact
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R data public _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
