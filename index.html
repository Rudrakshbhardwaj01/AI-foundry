<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI Foundry — daily developments in artificial intelligence.">
    <title>AI Foundry</title>
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem("ai-foundry-theme");
          var theme = saved === "light" || saved === "dark" ? saved : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) { /* The stylesheet's light theme remains the safe fallback. */ }
      }());
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-main">
        <div>
          <a class="wordmark" href="./" aria-label="AI Foundry home">AI Foundry</a>
          <p class="tagline">Daily developments in artificial intelligence.</p>
          <p class="subtagline">Clear. Concise. Always linked to the original source.</p>
        </div>
        <div class="header-tools">
          <div class="header-meta">
            <time id="current-date">Loading date</time>
            <span id="last-updated">Updated — awaiting publication</span>
          </div>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
            <span id="theme-toggle-label">Dark theme</span>
          </button>
        </div>
      </div>
      <nav class="category-nav" aria-label="Filter articles by category" id="category-nav"></nav>
    </header>

    <main class="page-shell">
      <div class="feed-status" id="feed-status" role="status" aria-live="polite">Loading the published edition…</div>
      <section class="article-list" id="article-list" aria-label="Latest AI developments"></section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
